name: CI

# Checks obligatorios de Fase 0: lint, type-check y aislamiento entre tenants.
# Configurar estos tres jobs como "required status checks" para `main` en
# GitHub (Settings > Branches > Branch protection rules) — ver README/PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tenant-isolation:
    name: Tenant isolation test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta Postgres + Auth locales en el runner y aplica las migraciones
      # de supabase/migrations sobre una base efímera. Nunca toca el proyecto
      # remoto ni datos reales — 100% sintético, coherente con el modelo de
      # entornos de CLAUDE.md.
      - name: Start local Supabase stack
        run: supabase start --exclude studio,edge-runtime,imgproxy,logflare,vector,pgadmin-schema-diff,pgbouncer

      - name: Export local Supabase credentials
        run: |
          set -euo pipefail
          STATUS="$(supabase status -o env)"
          URL="$(echo "$STATUS" | grep '^API_URL=' | cut -d= -f2- | tr -d '"')"
          ANON="$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')"
          SERVICE="$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')"
          if [ -z "$URL" ] || [ -z "$ANON" ] || [ -z "$SERVICE" ]; then
            echo "No se pudieron extraer las credenciales de 'supabase status -o env'." >&2
            echo "$STATUS" >&2
            exit 1
          fi
          echo "NEXT_PUBLIC_SUPABASE_URL=$URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE" >> "$GITHUB_ENV"

      - name: Run tenant isolation test
        run: npm run test:tenant-isolation

      # Mismo job a propósito (no un check requerido nuevo): comparte el
      # stack local de Supabase ya levantado arriba.
      - name: Run subscription state test
        run: npm run test:subscription-state

      # Cobertura del trigger de solo lectura: falla si una tabla con
      # clinic_id queda sin guard ni está en la lista explícita de exentas.
      - name: Run read-only guard test
        run: npm run test:readonly-guard

      # Lógica pura de qué aviso muestra la barra de la clínica (sin base de datos).
      - name: Run access banner test
        run: npm run test:access-banner

      # Exportación de pacientes y consultas con >1000 filas (no debe truncar), control de acceso
      # de Salud Mental y seguridad del archivo (inyección de formulas en CSV).
      - name: Run export test
        run: npm run test:export-encounters

      # Exportación de consentimientos, comprobantes fiscales, reclamaciones, citas y seguros:
      # completitud (>1000 filas), contenido (anulados/revocados/rechazados), RLS y seguridad del archivo.
      - name: Run export records test
        run: npm run test:export-records

      # Eliminación de datos a solicitud: advertencia, descarga registrada, 30 días, ejecución solo del
      # operador, archivo fiscal sin vínculo clínico, conservación vencida y aislamiento.
      - name: Run data deletion test
        run: npm run test:data-deletion

      # Aceptación de los términos en el registro (lógica pura, sin base de datos).
      - name: Run terms acceptance test
        run: npm run test:terms-acceptance

      # Reclamaciones a ARS (A.1 a A.3): catálogo, integridad paciente/comprobante, diagnósticos CIE, RLS.
      - name: Run claims test
        run: npm run test:claims

      # Reclamaciones a ARS (A.5 y A.6): paquete en Excel, reportes e historial de estados.
      - name: Run claims reports test
        run: npm run test:claims-reports

      # Autenticación de dos pasos (TOTP): la regla en la base de datos (aal1 sin acceso, aal2 con
      # acceso), operador, restablecimiento y auditoría.
      - name: Run MFA test
        run: npm run test:mfa

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
