<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2A4A"/>
      <stop offset="55%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0B4A4A"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="brandGradSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Faint large circle accents, echoing the landing hero style -->
  <circle cx="1080" cy="80" r="260" fill="#2DD4BF" opacity="0.06"/>
  <circle cx="60" cy="580" r="220" fill="#3B82F6" opacity="0.08"/>

  <!-- Central composition group -->
  <g transform="translate(600 315)">

    <!-- Document / expediente clínico card, slightly rotated left -->
    <g transform="translate(-165 -10) rotate(-6)">
      <rect x="-140" y="-190" width="280" height="380" rx="18" fill="#FFFFFF" opacity="0.97"/>
      <rect x="-140" y="-190" width="280" height="380" rx="18" fill="none" stroke="#CBD5E1" stroke-width="2"/>
      <!-- header bar of the document -->
      <rect x="-140" y="-190" width="280" height="54" rx="18" fill="url(#brandGrad)"/>
      <rect x="-140" y="-164" width="280" height="28" fill="url(#brandGrad)"/>
      <circle cx="-108" cy="-163" r="10" fill="#FFFFFF" opacity="0.9"/>
      <path d="M-113 -163 l3 4 l7 -8" stroke="url(#brandGrad)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-88" y="-168" width="150" height="10" rx="5" fill="#FFFFFF" opacity="0.85"/>
      <!-- body lines representing clinical/legal text -->
      <g fill="#94A3B8">
        <rect x="-108" y="-108" width="216" height="9" rx="4.5"/>
        <rect x="-108" y="-84" width="216" height="9" rx="4.5"/>
        <rect x="-108" y="-60" width="160" height="9" rx="4.5"/>
        <rect x="-108" y="-24" width="216" height="9" rx="4.5" opacity="0.55"/>
        <rect x="-108" y="0" width="216" height="9" rx="4.5" opacity="0.55"/>
        <rect x="-108" y="24" width="140" height="9" rx="4.5" opacity="0.55"/>
        <rect x="-108" y="60" width="216" height="9" rx="4.5" opacity="0.4"/>
        <rect x="-108" y="84" width="180" height="9" rx="4.5" opacity="0.4"/>
        <rect x="-108" y="108" width="216" height="9" rx="4.5" opacity="0.4"/>
        <rect x="-108" y="132" width="120" height="9" rx="4.5" opacity="0.4"/>
      </g>
    </g>

    <!-- Balance / scale of justice, layered on top to the right -->
    <g transform="translate(145 -35)">
      <!-- vertical post -->
      <rect x="-5" y="-115" width="10" height="215" rx="5" fill="url(#brandGradSoft)"/>
      <!-- base -->
      <path d="M-55 108 L55 108 L34 130 L-34 130 Z" fill="url(#brandGradSoft)"/>
      <rect x="-70" y="128" width="140" height="14" rx="7" fill="url(#brandGrad)"/>
      <!-- top finial -->
      <circle cx="0" cy="-122" r="11" fill="url(#brandGrad)"/>
      <!-- crossbar -->
      <rect x="-95" y="-100" width="190" height="8" rx="4" fill="url(#brandGrad)"/>
      <!-- left arm + pan -->
      <line x1="-92" y1="-96" x2="-92" y2="-38" stroke="url(#brandGradSoft)" stroke-width="4" stroke-linecap="round"/>
      <path d="M-124 -38 Q-92 8 -60 -38 Z" fill="none" stroke="url(#brandGradSoft)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- right arm + pan -->
      <line x1="92" y1="-96" x2="92" y2="-22" stroke="url(#brandGradSoft)" stroke-width="4" stroke-linecap="round"/>
      <path d="M60 -22 Q92 24 124 -22 Z" fill="none" stroke="url(#brandGradSoft)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- small medical cross emblem on the base, tying justice back to health -->
      <g transform="translate(0 119)">
        <rect x="-9" y="-3" width="18" height="6" rx="2" fill="#FFFFFF"/>
        <rect x="-3" y="-9" width="6" height="18" rx="2" fill="#FFFFFF"/>
      </g>
    </g>

  </g>

  <!-- Subtle bottom accent line, echoing brand gradient -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#brandGrad)"/>
</svg>
